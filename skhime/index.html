<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unity WebGL Player | Sakura Hime</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <script src="Build/UnityLoader.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #231F20;
      }

      #unityContainer {
        position: absolute;
        background: transparent !important;
      }

      #unityContainer canvas {
        position: absolute;
        display: block;
      }

      #split-loader {
        position: fixed;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;
        background: #231F20;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font: 14px/1.5 "Segoe UI", Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="unityContainer"></div>
    <div id="split-loader">
      <div style="width:min(70vw,640px)">
        <div style="height:14px;background:rgba(255,255,255,.15);border-radius:7px;overflow:hidden">
          <div id="split-bar" style="height:100%;width:0%;background:#2196f3;transition:width .12s linear"></div>
        </div>
        <div id="split-text" style="margin-top:10px;text-align:center">Preparing download&hellip;</div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";

        var MANIFEST_URL = "Build/WebGL.parts.json";
        var ASPECT = 900 / 1600;

        var overlay = document.getElementById("split-loader");
        var bar = document.getElementById("split-bar");
        var label = document.getElementById("split-text");

        var instance = null;
        var state = { bytes: 0, totalBytes: 0, doneParts: 0, totalParts: 0, message: "" };

        function render() {
          var pct = state.totalBytes > 0 ? Math.min(100, (state.bytes / state.totalBytes) * 100) : 0;
          bar.style.width = pct.toFixed(1) + "%";
          if (state.message) {
            label.textContent = state.message;
          } else if (state.doneParts < state.totalParts) {
            label.textContent = "Loading part " + (state.doneParts + 1) + " of " + state.totalParts + " (" + Math.round(pct) + "%)";
          } else {
            label.textContent = "Starting game (" + Math.round(pct) + "%)";
          }
        }

        // Fills the window with the game, letterboxing to the 16:9 stage so the picture is
        // never stretched when the window has a different shape.
        function onResize() {
          var container = instance ? instance.container : document.getElementById("unityContainer");
          if (!container) return;

          var canvas = instance ? instance.Module.canvas : container.querySelector("canvas");
          var w = window.innerWidth;
          var h = window.innerHeight;

          if (w * ASPECT > h) {
            w = Math.min(w, Math.ceil(h / ASPECT));
          }
          h = Math.floor(w * ASPECT);

          container.style.width = w + "px";
          container.style.height = h + "px";
          if (canvas) {
            canvas.style.width = w + "px";
            canvas.style.height = h + "px";
          }
          container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
          container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
        }

        window.addEventListener("resize", onResize);
        onResize();

        var wasmBlobUrl = null;

        function startGame(configUrl, wasmUrl) {
          // Size the container first: the loader sizes the canvas from it on instantiate.
          onResize();
          wasmBlobUrl = wasmUrl || null;

          instance = UnityLoader.instantiate("unityContainer", configUrl, {
            Module: {
              // The payloads are blob URLs, which the loader's own resolvers would rewrite into
              // "Build/blob:...", so both lookups are answered here instead.
              locateFile: function (file) {
                if (file === "build.wasm" && wasmBlobUrl) return wasmBlobUrl;
                return "Build/" + file;
              },
              resolveBuildUrl: function (url) {
                return /^(?:https?|ftp|file|blob|data):/i.test(url)
                  ? url
                  : new URL(url, document.baseURI).href;
              }
            },
            onerror: function (message) {
              bar.style.background = "#d9534f";
              label.textContent = "Failed to load: " + message;
              if (!overlay.parentNode) document.body.appendChild(overlay);
            }
          });
          window.unityInstance = instance;
          onResize();
          if (overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
        }

        // Fetches a URL, reporting how many bytes have arrived so far.
        async function fetchArrayBuffer(url, onBytes) {
          var res = await fetch(url);
          if (!res.ok) throw new Error("Failed to fetch " + url + " (" + res.status + ")");
          var length = Number(res.headers.get("Content-Length")) || 0;

          if (!res.body || !res.body.getReader) {
            var whole = await res.arrayBuffer();
            if (onBytes) onBytes(whole.byteLength);
            return whole;
          }

          var reader = res.body.getReader();
          var chunks = [];
          var received = 0;
          for (;;) {
            var step = await reader.read();
            if (step.done) break;
            chunks.push(step.value);
            received += step.value.byteLength;
            if (onBytes) onBytes(received);
          }

          var merged = new Uint8Array(received);
          var offset = 0;
          for (var i = 0; i < chunks.length; i++) {
            merged.set(chunks[i], offset);
            offset += chunks[i].byteLength;
          }
          return merged.buffer;
        }

        // Unity's .unityweb payloads are gzip streams that a web server normally decodes via
        // Content-Encoding. The parts are plain files, so the decoding has to happen here.
        async function decompressIfGzip(blob, mime) {
          var head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
          if (head[0] !== 0x1f || head[1] !== 0x8b) return blob;

          if (typeof DecompressionStream === "undefined") {
            throw new Error("this browser cannot decode the gzip payload");
          }

          var stream = blob.stream().pipeThrough(new DecompressionStream("gzip"));
          var buffer = await new Response(stream).arrayBuffer();
          return new Blob([buffer], { type: mime || "application/octet-stream" });
        }

        // Reassembles file.part0..file.partN into one blob URL, keeping a cached copy so
        // reloading the page does not download the parts again.
        async function loadFile(spec, cacheName, baseBytes) {
          var cache = null;
          try { cache = await caches.open(cacheName); } catch (e) { cache = null; }

          var fileUrl = new URL(spec.path, document.baseURI).href;

          if (cache) {
            var hit = await cache.match(fileUrl);
            if (hit) {
              var cachedBlob = await hit.blob();
              state.bytes = baseBytes + cachedBlob.size;
              state.doneParts += spec.parts;
              render();
              return URL.createObjectURL(await decompressIfGzip(cachedBlob, spec.mime));
            }
          }

          var buffers = [];
          var received = 0;
          for (var i = 0; i < spec.parts; i++) {
            var startBytes = baseBytes + received;
            var partUrl = new URL(spec.path + ".part" + i, document.baseURI).href;
            var buffer = await fetchArrayBuffer(partUrl, function (got) {
              state.bytes = startBytes + got;
              render();
            });
            buffers.push(buffer);
            received += buffer.byteLength;
            state.doneParts += 1;
            state.bytes = baseBytes + received;
            render();
          }

          var blob = new Blob(buffers, { type: spec.mime || "application/octet-stream" });
          if (cache) {
            try { await cache.put(fileUrl, new Response(blob)); } catch (e) { /* over quota: keep playing */ }
          }
          var playable = await decompressIfGzip(blob, spec.mime);
          return URL.createObjectURL(playable);
        }

        async function loadGame() {
          var manifest = null;
          try {
            var res = await fetch(MANIFEST_URL, { cache: "no-cache" });
            if (res.ok) manifest = await res.json();
          } catch (e) { manifest = null; }

          var jsonUrl = new URL("Build/WebGL.json", document.baseURI).href;

          if (!manifest || !manifest.files || manifest.files.length === 0) {
            label.textContent = "Starting game...";
            startGame(jsonUrl);
            return;
          }

          var cacheName = "sakura-parts-v" + (manifest.cacheVersion || 1);
          state.totalParts = manifest.files.reduce(function (n, f) { return n + f.parts; }, 0);
          state.totalBytes = manifest.files.reduce(function (n, f) { return n + f.bytes; }, 0);
          render();

          var config = await fetch(jsonUrl, { cache: "no-cache" }).then(function (r) { return r.json(); });

          var baseBytes = 0;
          var wasmUrl = null;
          for (var i = 0; i < manifest.files.length; i++) {
            var spec = manifest.files[i];
            config[spec.key] = await loadFile(spec, cacheName, baseBytes);
            if (spec.key === "wasmCodeUrl") wasmUrl = config[spec.key];
            baseBytes += spec.bytes;
            state.bytes = baseBytes;
            render();
          }

          ["wasmFrameworkUrl", "backgroundUrl", "asmCodeUrl", "asmMemoryUrl"].forEach(function (key) {
            if (config[key]) config[key] = new URL(config[key], jsonUrl).href;
          });

          state.message = "Starting game...";
          render();

          var configUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], { type: "application/json" }));
          startGame(configUrl, wasmUrl);
        }

        loadGame().catch(function (err) {
          console.error("Failed to load Sakura Hime:", err);
          bar.style.background = "#d9534f";
          label.textContent = "Failed to load: " + err.message;
        });
      })();
    </script>
  </body>
</html>
